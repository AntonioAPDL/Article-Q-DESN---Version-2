version: '1.1'
screen_id: glofas_fr09_constrained_p50_ranges_pending
launch_authorized: false
output_root: local_trackers/runtime_configs/glofas_fr09_constrained_p50_ranges_pending

base:
  baseline_contract: application/config/glofas_constrained_median_baseline_fr09.yaml
  candidate_id: fr09_persistence_innovation

fixed:
  quantile_level: 0.5
  inference:
    max_iter: 400
    max_iter_hard_cap: 400
    tol: 0.0001
    tol_par: 0.0001
    n_draws: 2000
    n_samp_xi: 500
  parameters:
    reference:
      pi_w: 0.03
      pi_in: 1.0
    discrepancy:
      pi_w: 0.03
      pi_in: 1.0

selection:
  require_vb_converged: false
  policy:
    max_observed_ratio_all: 1.05
    max_observed_ratio_last1000: 1.05
    max_observed_ratio_last200: 1.10
    max_observed_ratio_last50: 1.15
    last50_is_hard_gate: false
    min_forecast_improvement_fraction: 0.03

confirmation:
  require_cold_p50_refit_for_transferred_state: true
  require_authoritative_controls_for_finalist: true
  authoritative_max_iter: 400
  authoritative_tol: 0.0001
  authoritative_tol_par: 0.0001
  require_full7_before_promotion: true
  selection_metric_after_full7: genuine_quantile_grid_crps

execution:
  max_candidates: 500

scheduler:
  max_parallel: 4
  cores: [0, 1, 2, 3]
  max_load: 58
  min_memory_gb: 48
  min_disk_gb: 120

# Add only investigator-reviewed ranges. Each candidate set expands separately;
# this prevents an unintended Cartesian product across unrelated search stages.
# All omitted values inherit the exact FR09 values in the baseline contract.
#
# candidate_sets:
#   - set_id: example_alpha_tau
#     fixed:
#       reference:
#         D: 1
#         'n': 300
#       discrepancy:
#         D: 1
#         'n': 300
#     varying:
#       reference:
#         alpha: [REPLACE_WITH_REVIEWED_VALUES]
#         rhs_tau0: [REPLACE_WITH_REVIEWED_VALUES]
#       discrepancy:
#         alpha: [REPLACE_WITH_REVIEWED_VALUES]
#         rhs_tau0: [REPLACE_WITH_REVIEWED_VALUES]
candidate_sets: []
explicit_candidates: []
