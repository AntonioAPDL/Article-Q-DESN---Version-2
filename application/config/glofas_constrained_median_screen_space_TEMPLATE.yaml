#     fixed:
#       reference:
#         D: 4
#         'n': 100
#         n_tilde: 100
#     varying:
#       reference:
#         alpha: [0.05, 0.10]
#       discrepancy:
#         alpha: [0.05, 0.10]
candidate_sets: []
explicit_candidates: []
