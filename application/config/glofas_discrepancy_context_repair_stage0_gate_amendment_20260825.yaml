rationale: >-
  All three exact-design T01 continuations passed. Two of three T10 canaries
  passed, while the May T10 fit remained finite and semantically valid but
  numerically unstable and historically overfit. Stage 1 transfers only
  compatible future and sigma state from T01, never T10 coefficients or T10
  latent state. T10 is therefore retained as an advisory diagnostic comparator
  rather than an execution dependency. The original numerical thresholds and
  all final scientific promotion gates remain unchanged.
